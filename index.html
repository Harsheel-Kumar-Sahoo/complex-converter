<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complex Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F7;--surface:#fff;--ink:#101626;--muted:#6A7390;--line:#DDE2EE;
  --accent:#3D3BF3;--accent2:#00A38F;--soft:#E6E7FF;--onaccent:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1020;--surface:#151A30;--ink:#EEF1FF;--muted:#8E97B8;--line:#252C48;
    --accent:#7C84FF;--accent2:#2DD4BF;--soft:#20244A;--onaccent:#0C1020;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1020;--surface:#151A30;--ink:#EEF1FF;--muted:#8E97B8;--line:#252C48;
  --accent:#7C84FF;--accent2:#2DD4BF;--soft:#20244A;--onaccent:#0C1020;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:20px 18px 28px;display:flex;flex-direction:column;gap:14px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
