<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complex Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F7;--surface:#fff;--ink:#101626;--muted:#6A7390;--line:#DDE2EE;
  --accent:#3D3BF3;--accent2:#00A38F;--soft:#E6E7FF;--onaccent:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1020;--surface:#151A30;--ink:#EEF1FF;--muted:#8E97B8;--line:#252C48;
    --accent:#7C84FF;--accent2:#2DD4BF;--soft:#20244A;--onaccent:#0C1020;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1020;--surface:#151A30;--ink:#EEF1FF;--muted:#8E97B8;--line:#252C48;
  --accent:#7C84FF;--accent2:#2DD4BF;--soft:#20244A;--onaccent:#0C1020;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:20px 18px 28px;display:flex;flex-direction:column;gap:14px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--onaccent);display:grid;place-items:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.icon-btn:active{transform:scale(.94)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;position:relative}
.seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;font-weight:600;font-size:15px;color:var(--muted);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--onaccent)}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--accent);border-radius:12px;transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.seg.right .pill{transform:translateX(100%)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.field{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:6px 8px 6px 14px;border:1.5px solid transparent}
.field:focus-within{border-color:var(--accent)}
.field + .field{margin-top:10px}
.field label{display:flex;flex-direction:column;flex:1;min-width:0}
.field small{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:1px}
.field input{width:100%;border:0;background:none;font:inherit;font-size:26px;font-weight:600;color:var(--ink);padding:0;outline:none!important;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--line)}
.unit{font-size:13px;font-weight:600;color:var(--accent);padding-right:4px}
.sign{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.sign:active{background:var(--soft);color:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.mini button{height:34px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.mini button[aria-pressed="true"]{background:var(--soft);color:var(--accent)}
.swap{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink)}
.swap svg{transition:transform .3s}
.swap:active svg{transform:rotate(180deg)}
.result{background:var(--ink);color:var(--bg);border-radius:22px;padding:18px 18px 14px}
.result .top{display:flex;justify-content:space-between;align-items:center;color:var(--bg);opacity:.65;font-size:13px;font-weight:500}
.big{font-size:clamp(28px,9.2vw,40px);font-weight:700;letter-spacing:-.03em;margin:8px 0 12px;line-height:1.1;word-break:break-word;font-variant-numeric:tabular-nums}
.big.empty{opacity:.35}
.copy{display:flex;align-items:center;gap:6px;color:var(--bg);opacity:1;background:rgba(127,127,160,.25);height:32px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600}
.alt{display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(127,127,160,.3);padding-top:12px}
.alt div{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-variant-numeric:tabular-nums}
.alt span:first-child{opacity:.6}
.alt span:last-child{font-weight:600;text-align:right}
.plane{padding:12px}
.plane svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);padding:4px 6px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.field.bad{border-color:#E5484D}
.padopen .app{padding-bottom:330px}
.pad{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(16,22,38,.14)}
.pad[hidden]{display:none}
.pad .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:480px;margin:0 auto}
.k{height:46px;border-radius:13px;background:var(--bg);font-size:20px;font-weight:600;display:grid;place-items:center;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.k:active{background:var(--soft);transform:scale(.96)}
.k.fn{color:var(--accent);background:var(--soft);font-size:22px}
.k.op{color:var(--accent2)}
.k.done{background:var(--accent);color:var(--onaccent)}
.k.w2{grid-column:span 2}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="logo">
      <div class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M4 20 16 8"/><circle cx="16" cy="8" r="1.6" fill="currentColor"/></svg></div>
      <h1>Complex</h1>
    </div>
    <button class="icon-btn" id="clear" aria-label="Clear inputs"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
  </header>

  <div class="seg" id="seg" role="group" aria-label="Conversion direction">
    <span class="pill"></span>
    <button id="m-rp" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg>Rect to polar</button>
    <button id="m-pr" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 12l5-5"/></svg>Polar to rect</button>
  </div>

  <section class="card">
    <div class="field">
      <label><small id="l1">Real part (a)</small><input id="x1" inputmode="none" autocomplete="off" placeholder="0" value="3"></label>
      <button class="sign" data-for="x1" aria-label="Flip sign of first value"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v8M8 8h8M7 19h10"/></svg></button>
    </div>
    <div class="field">
      <label><small id="l2">Imaginary part (b)</small><input id="x2" inputmode="none" autocomplete="off" placeholder="0" value="4"></label>
      <span class="unit" id="u2" hidden>deg</span>
      <button class="sign" data-for="x2" aria-label="Flip sign of second value"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v8M8 8h8M7 19h10"/></svg></button>
    </div>
  </section>

  <div class="row">
    <div class="mini" id="unit" role="group" aria-label="Angle unit">
      <button data-u="deg" aria-pressed="true">Degrees</button>
      <button data-u="rad" aria-pressed="false">Radians</button>
    </div>
    <button class="swap" id="swap"><svg class="i" viewBox="0 0 24 24"><path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/></svg>Swap</button>
  </div>

  <section class="result" aria-live="polite">
    <div class="top"><span id="rlabel">Polar form</span>
      <button class="copy" id="copy"><svg class="i" id="ic-copy" viewBox="0 0 24 24" style="width:16px;height:16px"><rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><span id="ctext">Copy</span></button>
    </div>
    <div class="big" id="big">—</div>
    <div class="alt" id="alt"></div>
  </section>

  <section class="card plane">
    <svg id="plane" viewBox="0 0 320 300" role="img" aria-label="Argand diagram of the complex number"></svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Magnitude</span><span><i style="background:var(--accent2)"></i>Angle</span></div>
  </section>
</main>
<div class="pad" id="pad" hidden><div class="grid" id="grid"></div></div>

<script>
(function(){
  var mode='rp', unit='deg';
  var $=function(id){return document.getElementById(id)};
  var x1=$('x1'),x2=$('x2');

  function fmt(n){
    if(Math.abs(n)<1e-10)n=0;
    var s=(Math.round(n*1e4)/1e4).toFixed(4).replace(/\.?0+$/,'');
    return s==='-0'?'0':s;
  }
  function parse(str){
    var s=String(str).replace(/\s+/g,'').replace(/−/g,'-').replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.');
    if(!s)return NaN;
    var p=0;
    function peek(){return s.charAt(p)}
    function expr(){var v=term();while(peek()==='+'||peek()==='-'){var o=s.charAt(p++),r=term();v=o==='+'?v+r:v-r}return v}
    function term(){var v=unary();for(;;){var c=peek();
      if(c==='*'||c==='/'){p++;var r=unary();v=c==='*'?v*r:v/r}
      else if(c&&/[0-9.π√∛(]/.test(c)){v*=unary()}
      else break}return v}
    function unary(){var c=peek();if(c==='-'){p++;return -unary()}if(c==='+'){p++;return unary()}return primary()}
    function primary(){var c=peek();
      if(c==='('){p++;var v=expr();if(peek()===')')p++;return v}
      if(c==='√'||c==='∛'){p++;var u=unary();return c==='√'?Math.sqrt(u):Math.cbrt(u)}
      if(c==='π'){p++;return Math.PI}
      var m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(p));
      if(!m)throw new Error('x');
      p+=m[0].length;return parseFloat(m[0]);
    }
    try{var v=expr();if(p<s.length)return NaN;return isFinite(v)?v:NaN}catch(e){return NaN}
  }
  function norm(t){while(t>Math.PI)t-=2*Math.PI;while(t<=-Math.PI)t+=2*Math.PI;return t}
  var cur=null;

  function compute(){
    var p=parse(x1.value),q=parse(x2.value);
    if(isNaN(p)||isNaN(q))return null;
    var a,b,r,t;
    if(mode==='rp'){a=p;b=q;r=Math.hypot(a,b);t=r===0?0:Math.atan2(b,a)}
    else{r=p;t=unit==='deg'?q*Math.PI/180:q;a=r*Math.cos(t);b=r*Math.sin(t)}
    return{a:a,b:b,r:r,t:t};
  }
  function ang(t,u){return u==='deg'?t*180/Math.PI:t}
  function cstr(a,b){return fmt(a)+(b<0||Object.is(b,-0)?' − ':' + ')+fmt(Math.abs(b))+'i'}

  function render(){
    cur=compute();
    var big=$('big'),alt=$('alt'),other=unit==='deg'?'rad':'deg';
    var e1=x1.value.trim()!==''&&isNaN(parse(x1.value)),e2=x2.value.trim()!==''&&isNaN(parse(x2.value));
    x1.closest('.field').classList.toggle('bad',e1);x2.closest('.field').classList.toggle('bad',e2);
    if(!cur){big.textContent=(e1||e2)?'Check the expression':'Enter two values';big.className='big empty';alt.innerHTML='';drawPlane(null);return}
    big.className='big';
    var tn=mode==='rp'?norm(cur.t):cur.t;
    if(mode==='rp'){
      big.textContent=fmt(cur.r)+' ∠ '+fmt(ang(tn,unit))+(unit==='deg'?'°':' rad');
      alt.innerHTML=row('Angle in '+other,fmt(ang(tn,other))+(other==='deg'?'°':' rad'))+row('Euler form',fmt(cur.r)+' e^(i·'+fmt(tn)+')')+row('Rectangular',cstr(cur.a,cur.b));
    }else{
      big.textContent=cstr(cur.a,cur.b);
      alt.innerHTML=row('Real part',fmt(cur.a))+row('Imaginary part',fmt(cur.b))+row('Euler form',fmt(cur.r)+' e^(i·'+fmt(cur.t)+')');
    }
    drawPlane(cur);
  }
  function row(k,v){return '<div><span>'+k+'</span><span>'+v+'</span></div>'}

  function niceStep(m){
    var raw=m/3,e=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/e;
    return (f<1.5?1:f<3.5?2:f<7.5?5:10)*e;
  }
  function drawPlane(c){
    var W=320,H=300,cx=W/2,cy=H/2,R=128,s='';
    var m=c?Math.max(Math.abs(c.a),Math.abs(c.b),1e-6)*1.25:5;
    if(c&&c.r===0)m=5;
    var k=R/m,st=niceStep(m);
    for(var v=-Math.floor(m/st)*st;v<=m+1e-9;v+=st){
      var px=cx+v*k,py=cy-v*k,z=Math.abs(v)<st/1000;
      if(!z){
        s+='<line x1="'+px+'" y1="10" x2="'+px+'" y2="'+(H-10)+'" stroke="var(--line)" stroke-width="1"/>';
        s+='<line x1="10" y1="'+py+'" x2="'+(W-10)+'" y2="'+py+'" stroke="var(--line)" stroke-width="1"/>';
      }
    }
    s+='<g stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round"><line x1="10" y1="'+cy+'" x2="'+(W-10)+'" y2="'+cy+'"/><line x1="'+cx+'" y1="10" x2="'+cx+'" y2="'+(H-10)+'"/></g>';
    s+='<text x="'+(W-12)+'" y="'+(cy+16)+'" text-anchor="end" font-size="12" fill="var(--muted)" font-family="inherit">Re</text>';
    s+='<text x="'+(cx+8)+'" y="22" font-size="12" fill="var(--muted)" font-family="inherit">Im</text>';
    if(c){
      var X=cx+c.a*k,Y=cy-c.b*k,t=Math.atan2(c.b,c.a);
      s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+X+'" y2="'+Y+'" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>';
      s+='<line x1="'+X+'" y1="'+cy+'" x2="'+X+'" y2="'+Y+'" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".5"/>';
      s+='<line x1="'+cx+'" y1="'+Y+'" x2="'+X+'" y2="'+Y+'" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".5"/>';
      if(c.r>0&&Math.abs(t)>0.01){
        var ar=Math.min(34,c.r*k*0.45),ex=cx+ar*Math.cos(t),ey=cy-ar*Math.sin(t);
        s+='<path d="M'+(cx+ar)+' '+cy+' A'+ar+' '+ar+' 0 0 '+(t>0?0:1)+' '+ex+' '+ey+'" fill="none" stroke="var(--accent2)" stroke-width="3" stroke-linecap="round"/>';
      }
      s+='<circle cx="'+X+'" cy="'+Y+'" r="7" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/>';
    }
    $('plane').innerHTML=s;
  }

  function setMode(m){
    mode=m;
    $('seg').classList.toggle('right',m==='pr');
    $('m-rp').setAttribute('aria-pressed',m==='rp');
    $('m-pr').setAttribute('aria-pressed',m==='pr');
    var rp=m==='rp';
    $('l1').textContent=rp?'Real part (a)':'Magnitude (r)';
    $('l2').textContent=rp?'Imaginary part (b)':'Angle (θ)';
    $('u2').hidden=rp;
    $('rlabel').textContent=rp?'Polar form':'Rectangular form';
  }
  function setUnit(u){
    unit=u;$('u2').textContent=u;
    [].forEach.call($('unit').children,function(b){b.setAttribute('aria-pressed',b.dataset.u===u)});
  }
  $('m-rp').onclick=function(){if(mode!=='rp'){setMode('rp');render()}};
  $('m-pr').onclick=function(){if(mode!=='pr'){setMode('pr');render()}};
  $('unit').onclick=function(e){
    var b=e.target.closest('button');if(!b||b.dataset.u===unit)return;
    var old=unit;
    if(mode==='pr'){var v=parse(x2.value);if(!isNaN(v))x2.value=fmt(b.dataset.u==='deg'?v*180/Math.PI:v*Math.PI/180)}
    setUnit(b.dataset.u);render();
  };
  $('swap').onclick=function(){
    var c=compute();
    if(c){
      if(mode==='rp'){x1.value=fmt(c.r);x2.value=fmt(ang(norm(c.t),unit))}
      else{x1.value=fmt(c.a);x2.value=fmt(c.b)}
    }
    setMode(mode==='rp'?'pr':'rp');render();
  };
  $('clear').onclick=function(){x1.value='';x2.value='';x1.focus();render()};
  [].forEach.call(document.querySelectorAll('.sign'),function(b){
    b.onclick=function(){
      var i=$(b.dataset.for),v=i.value.trim();
      i.value=flip(v);
      render();
    };
  });
  x1.oninput=x2.oninput=render;
  $('copy').onclick=function(){
    var txt=$('big').textContent;if(!cur)return;
    try{navigator.clipboard.writeText(txt)}catch(e){}
    $('ctext').textContent='Copied';
    $('ic-copy').innerHTML='<path d="M5 12.5l4.5 4.5L19 7.5"/>';
    setTimeout(function(){$('ctext').textContent='Copy';$('ic-copy').innerHTML='<rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'},1400);
  };
  function flip(v){
    v=v.trim();if(!v)return '-';
    if(v.slice(0,2)==='-('&&v.slice(-1)===')')return v.slice(2,-1);
    var body=v.replace(/^[-−]/,'');
    var ops=/[+\-−×÷*\/]/.test(body);
    if(ops)return '-('+v+')';
    return /^[-−]/.test(v)?body:'-'+v;
  }

  /* On-screen keypad with square root and cube root */
  var I={
    bk:'<svg class="i" viewBox="0 0 24 24"><path d="M20 5H9l-6 7 6 7h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M14 10l4 4M18 10l-4 4"/></svg>',
    l:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
    r:'<svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
    ok:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  };
  var keys=[
    ['√','√(','fn','Square root'],['∛','∛(','fn','Cube root'],['π','π','fn','Pi'],['(','(','op'],[')',')','op'],
    ['7','7'],['8','8'],['9','9'],['÷','÷','op'],[I.bk,'bk','op','Backspace'],
    ['4','4'],['5','5'],['6','6'],['×','×','op'],['+','+','op'],
    ['1','1'],['2','2'],['3','3'],['−','−','op'],[I.ok,'done','done','Done'],
    ['0','0','w2'],['.','.'],[I.l,'l','op','Move left'],[I.r,'r','op','Move right']
  ];
  var act=x1,pad=$('pad'),grid=$('grid');
  keys.forEach(function(k){
    var b=document.createElement('button');
    b.className='k '+(k[2]||'');b.innerHTML=k[0];b.type='button';
    if(k[3])b.setAttribute('aria-label',k[3]);
    b.addEventListener('pointerdown',function(e){e.preventDefault()});
    b.addEventListener('click',function(){press(k[1])});
    grid.appendChild(b);
  });
  function press(a){
    var i=act,s=i.selectionStart,e=i.selectionEnd,v=i.value;
    if(a==='done'){i.blur();pad.hidden=true;document.body.classList.remove('padopen');return}
    if(!document.activeElement||document.activeElement!==i)i.focus();
    if(a==='l'||a==='r'){var p=Math.max(0,Math.min(v.length,(s===e?s:(a==='l'?s:e))+(s===e?(a==='l'?-1:1):0)));i.setSelectionRange(p,p);return}
    if(a==='bk'){
      if(s!==e){i.value=v.slice(0,s)+v.slice(e);i.setSelectionRange(s,s)}
      else if(s>0){var n=(/[√∛]\($/.test(v.slice(0,s)))?2:1;i.value=v.slice(0,s-n)+v.slice(s);i.setSelectionRange(s-n,s-n)}
      render();return;
    }
    i.value=v.slice(0,s)+a+v.slice(e);
